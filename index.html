<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心のふしサポーター</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');
:root {
  --cream: #fdf6ec;
  --gold: #c8922a;
  --red: #8b1a1a;
  --brown: #3d1f00;
  --brown-mid: #6b3a1f;
  --brown-light: #a0693a;
  --indigo: #1a2a4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--cream);
  color: var(--brown);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
  z-index: 100;
}
header {
  position: sticky; top: 4px; z-index: 50;
  background: rgba(253,246,236,0.97);
  border-bottom: 1px solid rgba(200,146,42,0.28);
  padding: 0 16px;
  backdrop-filter: blur(12px);
}
.header-inner {
  max-width: 680px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
}
.header-text h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px; font-weight: 600;
  color: var(--red); letter-spacing: 0.1em;
}
.header-text p {
  font-size: 10px; color: var(--brown-light);
  letter-spacing: 0.15em; margin-top: 2px;
}
main { flex: 1; padding: 24px 16px 16px; overflow-y: auto; }
.chat-wrap {
  max-width: 680px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 20px;
}
.welcome-card {
  background: linear-gradient(135deg, #fff8f0, #fdf0e0);
  border: 1px solid rgba(200,146,42,0.32);
  border-radius: 2px 18px 18px 18px;
  padding: 24px 24px 20px;
  box-shadow: 0 3px 20px rgba(61,31,0,0.06);
  position: relative;
  animation: fadeUp 0.6s ease;
}
.welcome-card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 3px; height: 38px; background: var(--red);
  border-radius: 0 0 2px 0;
}
.welcome-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; color: var(--red);
  letter-spacing: 0.1em; margin-bottom: 12px;
}
.welcome-body { font-size: 14px; line-height: 2; color: var(--brown); }
.welcome-body strong { color: var(--red); font-weight: 600; }
.divider-text {
  text-align: center; margin: 10px 0 12px;
  font-family: 'Noto Serif JP', serif;
  font-size: 11px; color: rgba(200,146,42,0.45);
  letter-spacing: 0.6em;
}
.msg-ai {
  display: flex; align-items: flex-start; gap: 10px;
  animation: fadeUp 0.4s ease;
}
.ai-avatar {
  width: 40px; height: 40px; flex-shrink: 0; margin-top: 2px;
}
.ai-bubble {
  background: #fff;
  border: 1px solid rgba(200,146,42,0.2);
  border-radius: 4px 18px 18px 18px;
  padding: 16px 18px;
  max-width: 82%;
  line-height: 1.95; font-size: 14.5px; color: var(--brown);
  box-shadow: 0 3px 14px rgba(61,31,0,0.05);
}
.msg-user {
  display: flex; justify-content: flex-end;
  animation: fadeUp 0.3s ease;
}
.user-bubble {
  background: linear-gradient(135deg, #1a2a4a, #2a3d6a);
  border-radius: 18px 4px 18px 18px;
  padding: 13px 18px;
  max-width: 74%;
  line-height: 1.85; font-size: 14.5px; color: #f0eee8;
  box-shadow: 0 3px 14px rgba(26,42,74,0.2);
}
.ora-divider {
  text-align: center;
  font-family: 'Noto Serif JP', serif;
  font-size: 12px; color: rgba(200,146,42,0.3);
  letter-spacing: 0.7em;
  animation: fadeUp 0.5s ease;
}
.dots span {
  display: inline-block;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold); margin: 0 3px;
  animation: bounce 1.3s infinite;
}
.dots span:nth-child(2) { animation-delay: 0.18s; }
.dots span:nth-child(3) { animation-delay: 0.36s; }
footer {
  position: sticky; bottom: 0; z-index: 50;
  background: rgba(253,246,236,0.97);
  border-top: 1px solid rgba(200,146,42,0.22);
  padding: 12px 16px 16px;
  backdrop-filter: blur(12px);
}
.input-row {
  max-width: 680px; margin: 0 auto;
  display: flex; gap: 10px; align-items: flex-end;
}
textarea {
  flex: 1; background: #fff;
  border: 1.5px solid rgba(200,146,42,0.38);
  border-radius: 14px; padding: 12px 16px;
  color: var(--brown); font-size: 14.5px;
  resize: none; outline: none;
  font-family: 'Noto Sans JP', sans-serif;
  line-height: 1.7;
  transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(200,146,42,0.12);
}
textarea::placeholder { color: rgba(107,58,31,0.38); }
button.send {
  background: linear-gradient(135deg, #8b1a1a, #b02020);
  border: none; border-radius: 14px;
  padding: 12px 20px; color: #fff;
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
  letter-spacing: 0.1em;
  box-shadow: 0 4px 12px rgba(139,26,26,0.28);
  transition: opacity 0.2s;
}
button.send:disabled { opacity: 0.4; cursor: not-allowed; }
.hint {
  max-width: 680px; margin: 6px auto 0;
  font-size: 11px; color: rgba(107,58,31,0.32);
  text-align: center; letter-spacing: 0.06em;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
  40%           { transform: scale(1);   opacity: 1; }
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: rgba(200,146,42,0.28); border-radius: 10px; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <svg class="ai-avatar" viewBox="0 0 60 60" fill="none">
      <circle cx="30" cy="30" r="28" fill="none" stroke="#c8922a" stroke-width="1.2"/>
      <circle cx="30" cy="30" r="22" fill="none" stroke="rgba(200,146,42,0.3)" stroke-width="0.8"/>
      <g transform="translate(30,30)">
        <circle cx="0" cy="-10" r="5.5" fill="#8b1a1a" opacity="0.85"/>
        <circle cx="9.5" cy="-3" r="5.5" fill="#8b1a1a" opacity="0.85"/>
        <circle cx="5.9" cy="8"  r="5.5" fill="#8b1a1a" opacity="0.85"/>
        <circle cx="-5.9" cy="8" r="5.5" fill="#8b1a1a" opacity="0.85"/>
        <circle cx="-9.5" cy="-3" r="5.5" fill="#8b1a1a" opacity="0.85"/>
        <circle cx="0" cy="0" r="4.5" fill="#c8922a"/>
      </g>
    </svg>
    <div class="header-text">
      <h1>心のふしサポーター</h1>
      <p>おやさまの温もりと共に・天理教お道の相談室</p>
    </div>
  </div>
</header>

<main>
  <div class="chat-wrap" id="chat">
    <div class="welcome-card">
      <div class="welcome-title">ようこそ、お道の相談室へ</div>
      <div class="welcome-body">
        日々のおたすけ・ひのきしんに励むあなたへ。<br>
        人生の「ふし」に直面されているあなたへ。<br><br>
        <strong>親神様・おやさまの思召</strong>を仰ぎながら、<br>
        一緒に心を整え、<strong>陽気ぐらし</strong>への道を歩みましょう。
      </div>
      <div class="divider-text">— 陽気ぐらし —</div>
      <div class="welcome-body">
        どんな小さなことでも、遠慮なくお話しください。<br>
        <strong>今、どのようなお悩みやふしをお持ちですか？</strong>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="inp" rows="2" placeholder="悩みごと、心のつかえ、なんでもお話しください…"></textarea>
    <button class="send" id="btn" onclick="send()">お伝えする</button>
  </div>
  <p class="hint">Enterで送信　／　Shift＋Enterで改行</p>
</footer>

<script>
// ★ここにAPIキーを貼り付けてください★
const API_KEY = "YOUR_API_KEY_HERE";

const SYSTEM = `あなたは、天理教の教え（お道の理）を土台として、相談者が自らの心を見つめ直し、たんのうの心へ近づけるよう寄り添う「お悩み相談・心のふしサポーター」です。

役割：
相談者の悩みや苦しみを否定せず、まず十分に受け止めます。あなたの目的は問題を解決することではなく、相談者自身が心の使い方を内観し、お道の理の中から気づきを見つけられるよう手助けすることです。

基本姿勢：
相談者の気持ちを否定しない。説教しない。正論を押し付けない。無理に前向きにさせない。相手のペースを尊重する。気づきを促す。親神様の守護への信頼につながる言葉を選ぶ。

お道の理の活用：
かりもの・かしもの、心ひとつがわが理、たんのう、ほこり、節（ふし）、親神様の自由自在の守護、陽気ぐらし、といった考え方を自然に活用してください。ただし教義説明は最小限とし、専門用語を並べ立てないこと。「宇宙の法則」「引き寄せ」「波動」などの表現は使わないこと。

返答フォーマット（必ずこの4つの流れで簡潔に返答する）：
1. 共感・ねぎらい（1〜2文）
2. お道の理で優しく捉え直す（1文）
3. 内観への問いかけ（1つだけ）
4. 安心感のある結びの一言

絶対に守ること：
- 絵文字・記号（*、#、括弧など）は一切使わない
- 返答は短くまとめる
- 問いかけは最後に1つだけ

口調：
教会の縁側でお茶を飲みながら話を聞いてくれる先輩信者のような雰囲気。柔らかく穏やか。少しだけ関西・大和言葉の温かさを含む。`;

let history = [];

function avatar() {
  return `<svg class="ai-avatar" viewBox="0 0 60 60" fill="none">
    <circle cx="30" cy="30" r="29" fill="#8b1a1a"/>
    <g transform="translate(30,30)">
      <circle cx="0" cy="-10" r="5.5" fill="white" opacity="0.92"/>
      <circle cx="9.5" cy="-3" r="5.5" fill="white" opacity="0.92"/>
      <circle cx="5.9" cy="8"  r="5.5" fill="white" opacity="0.92"/>
      <circle cx="-5.9" cy="8" r="5.5" fill="white" opacity="0.92"/>
      <circle cx="-9.5" cy="-3" r="5.5" fill="white" opacity="0.92"/>
      <circle cx="0" cy="0" r="4.2" fill="#c8922a"/>
    </g>
  </svg>`;
}

function addDivider() {
  const d = document.createElement('div');
  d.className = 'ora-divider';
  d.textContent = '— — —';
  document.getElementById('chat').appendChild(d);
}

function bubbleAI(html) {
  const w = document.createElement('div');
  w.className = 'msg-ai';
  w.innerHTML = avatar() + `<div class="ai-bubble">${html}</div>`;
  document.getElementById('chat').appendChild(w);
  w.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return w.querySelector('.ai-bubble');
}

function bubbleUser(text) {
  const w = document.createElement('div');
  w.className = 'msg-user';
  w.innerHTML = `<div class="user-bubble">${text.replace(/\n/g,'<br>')}</div>`;
  document.getElementById('chat').appendChild(w);
  w.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  document.getElementById('btn').disabled = true;

  if (history.length > 0) addDivider();
  bubbleUser(text);
  history.push({ role: 'user', content: text });

  const load = bubbleAI('<div class="dots"><span></span><span></span><span></span></div>');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data?.content?.[0]?.text || 'しばらくお待ちください。';
    const clean = reply.replace(/[\u{1F300}-\u{1FFFF}]/gu, '');
    load.innerHTML = clean.replace(/\n/g, '<br>');
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    load.innerHTML = '申し訳ございません、接続に問題が起きました。今しばらくお待ちください。';
  }
  document.getElementById('btn').disabled = false;
}
</script>
</body>
</html>
